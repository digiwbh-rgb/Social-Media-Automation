<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SMA — Social Media Automation</title>
<style>
/* ── Variables ──────────────────────────────────────────────────── */
:root {
  --bg:        #0d0f17;
  --s1:        #161928;
  --s2:        #1d2135;
  --s3:        #252840;
  --bd:        #2c304a;
  --bd-h:      #3d4165;
  --pri:       #6366f1;
  --pri-h:     #4f46e5;
  --pri-m:     rgba(99,102,241,.15);
  --pri-g:     rgba(99,102,241,.3);
  --ok:        #22c55e;  --ok-m:  rgba(34,197,94,.13);
  --warn:      #f59e0b;  --warn-m:rgba(245,158,11,.13);
  --err:       #ef4444;  --err-m: rgba(239,68,68,.13);
  --info:      #38bdf8;  --info-m:rgba(56,189,248,.13);
  --t1:#f1f5f9; --t2:#94a3b8; --t3:#64748b;
  --tw:#1d9bf0; --li:#0a66c2;
  --sw:220px; --th:58px;
  --r:8px; --rsm:5px; --rlg:12px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --ease:150ms ease;
  --shadow:0 8px 32px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;font-size:14px}
body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,select,textarea{font-family:inherit}
ul{list-style:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:99px}

/* ── Layout ─────────────────────────────────────────────────────── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ─────────────────────────────────────────────────────── */
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:18px 16px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:9px}
.logo-mark{width:30px;height:30px;background:var(--pri);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-text{font-size:15px;font-weight:700;letter-spacing:.04em}
.ls-badge{display:flex;align-items:center;gap:5px;background:var(--s3);border:1px solid var(--bd);border-radius:99px;padding:3px 8px;font-size:11px;color:var(--t3)}
.ls-dot{width:5px;height:5px;border-radius:50%;background:var(--ok)}
.nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rsm);color:var(--t2);font-size:13px;font-weight:500;transition:background var(--ease),color var(--ease);user-select:none;cursor:pointer}
.nav-item svg{opacity:.7;flex-shrink:0;transition:opacity var(--ease)}
.nav-item:hover{background:var(--s3);color:var(--t1)}
.nav-item:hover svg{opacity:1}
.nav-item.active{background:var(--pri-m);color:var(--pri)}
.nav-item.active svg{opacity:1}
.nav-div{height:1px;background:var(--bd);margin:6px 4px}
.sb-foot{padding:12px 16px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.ver{font-size:11px;color:var(--t3);font-family:var(--mono)}

/* ── Main ────────────────────────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--th);min-height:var(--th);background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px}
.tb-title{font-size:16px;font-weight:600}
.tb-acts{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:24px}

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid transparent;border-radius:var(--rsm);font-size:13px;font-weight:500;transition:background var(--ease),color var(--ease),border-color var(--ease),box-shadow var(--ease);white-space:nowrap;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn-primary:hover:not(:disabled){background:var(--pri-h);border-color:var(--pri-h);box-shadow:0 0 0 3px var(--pri-g)}
.btn-ghost{background:transparent;color:var(--t2);border-color:var(--bd)}
.btn-ghost:hover:not(:disabled){background:var(--s3);color:var(--t1);border-color:var(--bd-h)}
.btn-danger{background:transparent;color:var(--err);border-color:var(--err)}
.btn-danger:hover:not(:disabled){background:var(--err-m)}
.btn-success{background:var(--ok);color:#000;border-color:var(--ok)}
.btn-success:hover:not(:disabled){filter:brightness(1.1)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-icon{padding:6px;border-radius:var(--rsm)}

/* ── Cards ───────────────────────────────────────────────────────── */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rlg);padding:20px}
.card-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px}

/* ── Stat cards ──────────────────────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rlg);padding:18px 20px;border-left:3px solid var(--bd)}
.stat:hover{border-color:var(--bd-h)}
.stat.s-total   {border-left-color:var(--pri)}
.stat.s-pending {border-left-color:var(--warn)}
.stat.s-pub     {border-left-color:var(--ok)}
.stat.s-fail    {border-left-color:var(--err)}
.stat-lbl{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:6px}
.stat-val{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat.s-total   .stat-val{color:var(--t1)}
.stat.s-pending .stat-val{color:var(--warn)}
.stat.s-pub     .stat-val{color:var(--ok)}
.stat.s-fail    .stat-val{color:var(--err)}
.stat-sub{font-size:11px;color:var(--t3);margin-top:4px}

/* ── Section ─────────────────────────────────────────────────────── */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-size:14px;font-weight:600}

/* ── Two-col dashboard ────────────────────────────────────────────── */
.dash-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr}}

/* ── Activity timeline ───────────────────────────────────────────── */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);position:relative}
.tl-item:last-child{border-bottom:none}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.tl-dot.ok  {background:var(--ok)}
.tl-dot.warn{background:var(--warn)}
.tl-dot.err {background:var(--err)}
.tl-dot.info{background:var(--pri)}
.tl-dot.grey{background:var(--t3)}
.tl-body{flex:1;min-width:0}
.tl-msg{font-size:13px;color:var(--t1);line-height:1.4}
.tl-sub{font-size:11px;color:var(--t3);margin-top:2px}
.tl-empty{text-align:center;padding:24px;color:var(--t3);font-size:13px}

/* ── Upcoming posts ──────────────────────────────────────────────── */
.upcoming-list{display:flex;flex-direction:column;gap:8px}
.upc-item{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:background var(--ease)}
.upc-item:hover{background:var(--s3)}
.upc-left{flex:1;min-width:0}
.upc-preview{font-size:13px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upc-meta{font-size:11px;color:var(--t3);margin-top:3px;display:flex;align-items:center;gap:8px}
.upc-empty{font-size:13px;color:var(--t3);padding:16px 0;text-align:center}

/* ── Quick actions ───────────────────────────────────────────────── */
.qa-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.qa-card{flex:1;min-width:160px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--rlg);padding:16px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all var(--ease)}
.qa-card:hover{background:var(--s2);border-color:var(--bd-h);transform:translateY(-1px)}
.qa-icon{width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qa-icon.p{background:var(--pri-m);color:var(--pri)}
.qa-icon.g{background:var(--ok-m);color:var(--ok)}
.qa-icon.a{background:var(--warn-m);color:var(--warn)}
.qa-text strong{display:block;font-size:13px;font-weight:600;color:var(--t1)}
.qa-text span{font-size:11px;color:var(--t3)}

/* ── Form ────────────────────────────────────────────────────────── */
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-group:last-child{margin-bottom:0}
.form-label{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em}
.form-hint{font-size:11px;color:var(--t3)}
input[type=text],input[type=password],input[type=datetime-local],input[type=number],select,textarea{
  background:var(--s2);border:1px solid var(--bd);border-radius:var(--rsm);color:var(--t1);padding:8px 11px;font-size:13px;outline:none;width:100%;transition:border-color var(--ease),box-shadow var(--ease)}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-m)}
select option{background:var(--s3)}
textarea{resize:vertical;min-height:80px;font-family:var(--font);line-height:1.6}
.char-count{font-size:11px;text-align:right;color:var(--t3);transition:color var(--ease)}
.char-count.warn{color:var(--warn)}
.char-count.over{color:var(--err)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.input-wrap{position:relative}
.input-wrap input{padding-right:38px}
.eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--t3);padding:2px;line-height:0}
.eye-btn:hover{color:var(--t1)}

/* Platform toggle */
.plat-toggle{display:flex;gap:0;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;width:fit-content}
.plat-opt{padding:8px 18px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;transition:background var(--ease),color var(--ease);display:flex;align-items:center;gap:6px;border-right:1px solid var(--bd)}
.plat-opt:last-child{border-right:none}
.plat-opt:hover{background:var(--s3);color:var(--t1)}
.plat-opt.active-tw{background:rgba(29,155,240,.15);color:var(--tw)}
.plat-opt.active-li{background:rgba(10,102,194,.15);color:var(--li)}

/* ── AI generate panel ────────────────────────────────────────────── */
.ai-panel{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-top:-4px}
.ai-panel-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background var(--ease)}
.ai-panel-head:hover{background:var(--s3)}
.ai-panel-label{font-size:12px;font-weight:600;color:var(--pri);display:flex;align-items:center;gap:6px}
.ai-panel-body{padding:14px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:12px}
.ai-result{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rsm);padding:12px 14px;margin-top:4px}
.ai-result-text{font-size:13px;line-height:1.65;color:var(--t1);white-space:pre-wrap;word-break:break-word}
.ai-result-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.ai-result-meta{font-size:11px;color:var(--t3)}
.ai-result-acts{display:flex;gap:6px}

/* ── Schedule form layout ─────────────────────────────────────────── */
.sched-layout{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
@media(max-width:860px){.sched-layout{grid-template-columns:1fr}}
.sched-preview{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rlg);padding:20px;position:sticky;top:0}
.preview-phone{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:14px;font-size:13px;line-height:1.65;color:var(--t2);min-height:80px;white-space:pre-wrap;word-break:break-word}
.preview-phone.has-content{color:var(--t1)}
.preview-meta{font-size:11px;color:var(--t3);margin-top:8px;display:flex;align-items:center;justify-content:space-between}

/* ── Table ───────────────────────────────────────────────────────── */
.table-wrap{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rlg);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--s2);padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;border-bottom:1px solid var(--bd)}
tbody tr{border-bottom:1px solid var(--bd);transition:background var(--ease)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--s2)}
tbody td{padding:11px 14px;vertical-align:middle}
.td-mono{font-family:var(--mono);font-size:12px;color:var(--t2)}
.td-dim{color:var(--t3);font-size:12px}
.td-acts{display:flex;gap:5px;align-items:center}
.td-preview{max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2)}
.empty-tbl{text-align:center;padding:48px 24px;color:var(--t3)}
.empty-tbl svg{opacity:.3;margin-bottom:10px}
.empty-tbl p{font-size:13px}

/* ── Filters ─────────────────────────────────────────────────────── */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filter-lbl{font-size:12px;color:var(--t3);white-space:nowrap}
select.filter{padding:5px 10px;width:auto;font-size:12px}

/* ── Badges ──────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.bdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.b-pending  {background:var(--warn-m);color:var(--warn)}    .b-pending  .bdot{background:var(--warn)}
.b-published{background:var(--ok-m);color:var(--ok)}         .b-published .bdot{background:var(--ok)}
.b-failed   {background:var(--err-m);color:var(--err)}       .b-failed   .bdot{background:var(--err)}
.b-cancelled{background:rgba(100,116,139,.15);color:var(--t3)}.b-cancelled .bdot{background:var(--t3)}
.b-tw{background:rgba(29,155,240,.15);color:var(--tw)}
.b-li{background:rgba(10,102,194,.15);color:var(--li)}

/* ── Config ──────────────────────────────────────────────────────── */
.cfg-sections{display:flex;flex-direction:column;gap:18px;max-width:680px}
.cfg-sec{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rlg);overflow:hidden}
.cfg-sec-head{padding:12px 18px;background:var(--s2);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.cfg-sec-title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
.cfg-icon{width:24px;height:24px;border-radius:var(--rsm);display:flex;align-items:center;justify-content:center;font-size:13px}
.ci-tw{background:rgba(29,155,240,.18);color:var(--tw)}
.ci-li{background:rgba(10,102,194,.18);color:var(--li)}
.ci-ai{background:var(--pri-m);color:var(--pri)}
.ci-ap{background:rgba(100,116,139,.15);color:var(--t2)}
.cfg-sec-body{padding:18px}
.cfg-notice{background:var(--warn-m);border:1px solid rgba(245,158,11,.25);border-radius:var(--r);padding:10px 14px;font-size:12px;color:var(--warn);margin-bottom:18px;display:flex;gap:8px;align-items:flex-start}
.verify-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.verify-ok {background:var(--ok-m); color:var(--ok)}
.verify-err{background:var(--err-m);color:var(--err)}

/* ── Modal ───────────────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px);animation:fIn .12s ease}
.overlay.hidden{display:none}
.modal{background:var(--s1);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:500px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:sUp .16s ease}
.modal-lg{max-width:640px}
.modal-head{padding:18px 20px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600}
.modal-x{color:var(--t3);font-size:22px;line-height:1;padding:0 4px;transition:color var(--ease)}
.modal-x:hover{color:var(--t1)}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{padding:12px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.det-row{display:flex;gap:10px;margin-bottom:10px;font-size:13px}
.det-key{min-width:110px;color:var(--t3);font-size:12px;padding-top:1px;flex-shrink:0}
.det-val{color:var(--t1);word-break:break-all}
.det-content{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rsm);padding:12px 14px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin-top:8px}
.confirm-text{font-size:13px;color:var(--t2);line-height:1.6}

/* ── Toasts ──────────────────────────────────────────────────────── */
.toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:2000}
.toast{display:flex;align-items:center;gap:9px;background:var(--s3);border:1px solid var(--bd);border-radius:var(--r);padding:11px 15px;font-size:13px;color:var(--t1);box-shadow:var(--shadow);min-width:220px;max-width:340px;animation:sIn .2s ease}
.toast.ok  {border-color:var(--ok)}
.toast.err {border-color:var(--err)}
.toast.warn{border-color:var(--warn)}
.toast-ico{font-size:15px;flex-shrink:0}
.toast.gone{animation:fOut .3s ease forwards}
.spinner-sm{width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
.spinner-lg{width:28px;height:28px;border:3px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:spin .6s linear infinite;margin:40px auto;display:block}

/* ── Responsive ──────────────────────────────────────────────────── */
@media(max-width:640px){
  .sidebar{width:52px;min-width:52px}
  .logo-text,.ls-badge,.nav-item span,.ver,.sb-foot span:not(.ver){display:none}
  .nav-item{justify-content:center;padding:10px}
  .nav-item svg{opacity:1}
  .topbar{padding:0 14px}
  .content{padding:14px}
}

/* ── Animations ──────────────────────────────────────────────────── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fIn{from{opacity:0}to{opacity:1}}
@keyframes fOut{from{opacity:1}to{opacity:0}}
@keyframes sUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes sIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-head">
      <div class="logo">
        <div class="logo-mark">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8c0-2.761 2.239-5 5-5s5 2.239 5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="8" cy="11" r="2" fill="#fff"/>
            <circle cx="3" cy="8" r="1.2" fill="rgba(255,255,255,.6)"/>
            <circle cx="13" cy="8" r="1.2" fill="rgba(255,255,255,.6)"/>
          </svg>
        </div>
        <span class="logo-text">SMA</span>
      </div>
      <div class="ls-badge"><span class="ls-dot"></span><span>local</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-item active" data-view="dashboard">

/* ══════════════════════════════════════════════════════════════════

══════════════════════════════════════════════════════════════════ */
const DB = {
  _get(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } },
  _set(k, v)   { localStorage.setItem(k, JSON.stringify(v)); },

  // Posts
  posts()       { return this._get('sma_posts', []); },
  savePosts(p)  { this._set('sma_posts', p); },
  createPost(p) {
    const posts = this.posts();
    const id = (posts.reduce((m,x) => Math.max(m, x.id||0), 0)) + 1;
    const post = { id, ...p, retry_count: 0, created_at: new Date().toISOString() };
    this.savePosts([...posts, post]);
    this.log('info', `Post #${id} scheduled on ${p.platform}`, p.platform);
    return post;
  },
  updatePost(id, patch) {
    const posts = this.posts().map(p => p.id === id ? { ...p, ...patch } : p);
    this.savePosts(posts);
  },
  deletePost(id) {
    this.savePosts(this.posts().filter(p => p.id !== id));
    this.log('grey', `Post #${id} deleted`);
  },

  // Activity log
  activity()    { return this._get('sma_activity', []); },
  log(type, msg, platform) {
    const acts = this.activity();
    acts.unshift({ id: Date.now(), ts: new Date().toISOString(), type, msg, platform });
    this._set('sma_activity', acts.slice(0, 60));
  },
  clearActivity() { this._set('sma_activity', []); },

  // Config
  config()      { return this._get('sma_config', {}); },
  saveConfig(c) { this._set('sma_config', c); this.log('grey', 'Credentials updated'); },
};

/* ══════════════════════════════════════════════════════════════════
   Utils
══════════════════════════════════════════════════════════════════ */
const CHAR_LIMITS = { twitter: 280, linkedin: 3000 };

function esc(s)    { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function lim(p)    { return CHAR_LIMITS[p] || 280; }

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' }) + ' ' +
         d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}
function fmtRel(iso) {
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const abs  = Math.abs(diff);
  const m = Math.floor(abs/60000), h = Math.floor(abs/3600000), d = Math.floor(abs/86400000);
  const fut = diff < 0;
  if (m < 1)   return fut ? 'any moment' : 'just now';
  if (m < 60)  return fut ? `in ${m}m`  : `${m}m ago`;
  if (h < 24)  return fut ? `in ${h}h`  : `${h}h ago`;
  return fut ? `in ${d}d` : `${d}d ago`;
}

function statusBadge(s) {
  return `<span class="badge b-${s}"><span class="bdot"></span>${s}</span>`;
}
function platBadge(p) {
  const icons = {
    twitter: `<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.741l7.735-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
    linkedin:`<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`,
  };
  return `<span class="badge b-${p === 'twitter' ? 'tw' : 'li'}">${icons[p]||''} ${p}</span>`;
}

/* ══════════════════════════════════════════════════════════════════
   Toast
══════════════════════════════════════════════════════════════════ */
function toast(msg, type = 'ok') {
  const icons = { ok:'✓', err:'✕', warn:'⚠', info:'ℹ' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="toast-ico">${icons[type]||'ℹ'}</span><span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('gone'); setTimeout(() => el.remove(), 300); }, 3000);
}

const S = { view: 'dashboard', pf: 'all', ps: 'all', schedPlatform: 'twitter' };

function nav(view) {
  S.view = view;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));

  const clearLogBtn = document.getElementById('btn-clear-log');
  clearLogBtn.style.display = view === 'dashboard' ? '' : 'none';
  render();
}

function render() {
  const c = document.getElementById('content');
  switch (S.view) {
    case 'dashboard': renderDash(c);     break;
    case 'schedule':  renderSchedule(c); break;
    case 'posts':     renderPosts(c);    break;
    case 'config':    renderConfig(c);   break;
    default: c.innerHTML = '';
  }
}

/* ══════════════════════════════════════════════════════════════════

══════════════════════════════════════════════════════════════════ */
function renderDash(c) {

    .filter(p => p.status === 'pending')
    .sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at))

/* ══════════════════════════════════════════════════════════════════
   Simulate publish (runs due posts as a mock scheduler tick)
══════════════════════════════════════════════════════════════════ */
function simulatePublish() {
  const now  = new Date();
  const posts = DB.posts();
  const due  = posts.filter(p => p.status === 'pending' && new Date(p.scheduled_at) <= now);
  if (!due.length) { toast('No posts are due right now.', 'info'); return; }
  due.forEach(p => {
    DB.updatePost(p.id, { status:'published', published_at: now.toISOString(), platform_id:`mock_${Date.now()}_${p.id}` });
    DB.log('ok', `Post #${p.id} published on ${p.platform}`, p.platform);
  });
  toast(`Published ${due.length} post${due.length > 1 ? 's' : ''} (simulated)`, 'ok');
  render();
}

/* ── Post detail modal ── */

  const p = DB.posts().find(x => x.id === id);
  if (!p) return;
  openModal(`Post #${p.id}`, `
    <div class="det-row"><span class="det-key">Platform</span><span class="det-val">${platBadge(p.platform)}</span></div>
    <div class="det-row"><span class="det-key">Status</span><span class="det-val">${statusBadge(p.status)}</span></div>
    <div class="det-row"><span class="det-key">Scheduled</span><span class="det-val">${fmtDate(p.scheduled_at)} <span style="color:var(--t3);font-size:11px">${fmtRel(p.scheduled_at)}</span></span></div>
    <div class="det-row"><span class="det-key">Published</span><span class="det-val">${fmtDate(p.published_at)}</span></div>
    <div class="det-row"><span class="det-key">Platform ID</span><span class="det-val td-mono" style="font-size:12px">${esc(p.platform_id)||'—'}</span></div>
    <div class="det-row"><span class="det-key">Retries</span><span class="det-val">${p.retry_count}</span></div>
    ${p.error_message ? `<div class="det-row"><span class="det-key">Error</span><span class="det-val" style="color:var(--err);font-size:12px">${esc(p.error_message)}</span></div>` : ''}
    <div style="margin-top:10px"><div class="det-key" style="margin-bottom:6px">Content</div><div class="det-content">${esc(p.content)}</div></div>
    <div class="modal-foot">
      ${p.status==='pending' ? `<button class="btn btn-ghost btn-sm" id="mod-cancel">Cancel post</button>` : ''}
      <button class="btn btn-ghost btn-sm" id="mod-copy">Copy content</button>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button>
    </div>`, true);

  document.getElementById('mod-copy')?.addEventListener('click', () => {
    navigator.clipboard?.writeText(p.content); toast('Copied to clipboard');
  });
  document.getElementById('mod-cancel')?.addEventListener('click', () => { closeModal(); confirmCancel(id); });
}

function confirmCancel(id) {
  openModal('Cancel Post', `
    <p class="confirm-text">Cancel post <strong>#${id}</strong>? It stays in the database with status <em>cancelled</em>.</p>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Keep it</button>
      <button class="btn btn-danger btn-sm" id="do-cancel">Yes, cancel</button>
    </div>`);
  document.getElementById('do-cancel').addEventListener('click', () => {
    DB.updatePost(id, { status:'cancelled' });
    DB.log('grey', `Post #${id} cancelled`);
    toast(`Post #${id} cancelled`, 'warn');
    closeModal(); render();
  });
}

function confirmDelete(id) {
  openModal('Delete Post', `
    <p class="confirm-text">Permanently delete post <strong>#${id}</strong>? This cannot be undone.</p>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Keep it</button>
      <button class="btn btn-danger btn-sm" id="do-del">Delete</button>
    </div>`);
  document.getElementById('do-del').addEventListener('click', () => {
    DB.deletePost(id); toast(`Post #${id} deleted`, 'warn');
    closeModal(); render();
  });
}

      <label class="form-label" for="${id}">${label}</label>
      ${secret
        ? `<div class="input-wrap"><input type="password" id="${id}" value="${esc(val||'')}" placeholder="${ph}" /><button type="button" class="eye-btn" data-t="${id}" title="Show/hide"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 011.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0114.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 011.172 8z"/><path d="M8 5.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM4.5 8a3.5 3.5 0 117 0 3.5 3.5 0 01-7 0z"/></svg></button></div>`
        : `<input type="text" id="${id}" value="${esc(val||'')}" placeholder="${ph}" />`
      }
    </div>`;

  c.innerHTML = `
    <div class="cfg-sections">

      <div class="cfg-notice">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" style="flex-shrink:0;margin-top:1px"><path d="M8 16A8 8 0 108 0a8 8 0 000 16zm.93-9.412l-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 110-2 1 1 0 010 2z"/></svg>
        <div><strong>Client-side storage only.</strong> Credentials are saved in your browser's localStorage and never leave this device. Do not use on shared computers.</div>
      </div>

      <!-- Twitter -->
      <div class="cfg-sec">
        <div class="cfg-sec-head">
          <div class="cfg-sec-title">
            <div class="cfg-icon ci-tw"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.741l7.735-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></div>
            Twitter / X
          </div>
          <span class="verify-tag" id="vt-tw" style="display:none"></span>
        </div>
        <div class="cfg-sec-body">
          <div class="form-row">
            ${field('tw-api-key',    'API Key',    tw.api_key,    'Consumer key')}
            ${field('tw-api-sec',    'API Secret', tw.api_secret, 'Consumer secret', true)}
          </div>
          <div class="form-row">
            ${field('tw-at',         'Access Token',        tw.access_token,        'OAuth access token')}
            ${field('tw-at-sec',     'Access Token Secret', tw.access_token_secret, '', true)}
          </div>
          ${field('tw-bearer',       'Bearer Token (optional)', tw.bearer_token, 'App-only bearer token')}
        </div>
      </div>

      <!-- LinkedIn -->
      <div class="cfg-sec">
        <div class="cfg-sec-head">
          <div class="cfg-sec-title">
            <div class="cfg-icon ci-li"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></div>
            LinkedIn
          </div>
          <span class="verify-tag" id="vt-li" style="display:none"></span>
        </div>
        <div class="cfg-sec-body">
          <div class="form-row">
            ${field('li-cid',  'Client ID',     li.client_id,     '')}
            ${field('li-csec', 'Client Secret', li.client_secret, '', true)}
          </div>
          ${field('li-at',   'Access Token',  li.access_token,  '', true)}
          ${field('li-urn',  'Person URN',    li.person_urn,    'urn:li:person:XXXXXXXX')}
        </div>
      </div>

      <!-- Claude AI -->
      <div class="cfg-sec">
        <div class="cfg-sec-head">
          <div class="cfg-sec-title">
            <div class="cfg-icon ci-ai"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M7.657 6.247c.11-.33.576-.33.686 0l.645 1.937a2.89 2.89 0 001.829 1.828l1.936.645c.33.11.33.576 0 .686l-1.937.645a2.89 2.89 0 00-1.828 1.829l-.645 1.936a.361.361 0 01-.686 0l-.645-1.937a2.89 2.89 0 00-1.828-1.828l-1.937-.645a.361.361 0 010-.686l1.937-.645a2.89 2.89 0 001.828-1.828l.645-1.937zM3.794 1.148a.217.217 0 01.412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 010 .412l-1.162.387A1.734 1.734 0 004.593 5.69l-.387 1.162a.217.217 0 01-.412 0L3.407 5.69A1.734 1.734 0 002.31 4.593l-1.162-.387a.217.217 0 010-.412l1.162-.387A1.734 1.734 0 003.407 2.31l.387-1.162z"/></svg></div>
            Claude / Anthropic AI
          </div>
        </div>
        <div class="cfg-sec-body">
          ${field('cl-key', 'API Key', cl.api_key, 'sk-ant-…', true)}
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="cl-model">Model</label>
              <select id="cl-model">
                <option value="claude-sonnet-4-6" ${cl.model==='claude-sonnet-4-6'||!cl.model?'selected':''}>claude-sonnet-4-6</option>
                <option value="claude-opus-4-7"   ${cl.model==='claude-opus-4-7'  ?'selected':''}>claude-opus-4-7</option>
                <option value="claude-haiku-4-5-20251001" ${cl.model==='claude-haiku-4-5-20251001'?'selected':''}>claude-haiku-4-5</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="cl-mt">Max Tokens</label>
              <input type="number" id="cl-mt" value="${cl.max_tokens||1024}" min="256" max="4096"/>
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-primary" id="cfg-save">Save to localStorage</button>
        <button class="btn btn-ghost" id="cfg-export">Export JSON</button>
        <button class="btn btn-danger" id="cfg-clear">Clear all data</button>
        <span style="font-size:11px;color:var(--t3);flex:1">Changes are saved in your browser only.</span>
      </div>
    </div>`;

  /* Eye toggles */
  c.querySelectorAll('.eye-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const el = document.getElementById(btn.dataset.t);
      if (el) el.type = el.type === 'password' ? 'text' : 'password';
    });
  });

  /* Save */
  document.getElementById('cfg-save').addEventListener('click', () => {
    DB.saveConfig({
      twitter: {
        api_key:              document.getElementById('tw-api-key').value,
        api_secret:           document.getElementById('tw-api-sec').value,
        access_token:         document.getElementById('tw-at').value,
        access_token_secret:  document.getElementById('tw-at-sec').value,
        bearer_token:         document.getElementById('tw-bearer').value,
      },
      linkedin: {
        client_id:     document.getElementById('li-cid').value,
        client_secret: document.getElementById('li-csec').value,
        access_token:  document.getElementById('li-at').value,
        person_urn:    document.getElementById('li-urn').value,
      },
      claude: {
        api_key:    document.getElementById('cl-key').value,
        model:      document.getElementById('cl-model').value,
        max_tokens: +document.getElementById('cl-mt').value,
      },
    });
    toast('Credentials saved to localStorage');
  });

  /* Export */
  document.getElementById('cfg-export').addEventListener('click', () => {
    const data = JSON.stringify({ config: DB.config(), posts: DB.posts() }, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = `sma-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    toast('Backup downloaded');
  });

  /* Clear all */
  document.getElementById('cfg-clear').addEventListener('click', () => {
    openModal('Clear All Data', `
      <p class="confirm-text">This will permanently delete <strong>all posts, credentials, and activity logs</strong> from localStorage. You cannot undo this.</p>
      <div class="modal-foot">
        <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger btn-sm" id="do-clear">Yes, clear everything</button>
      </div>`);
    document.getElementById('do-clear').addEventListener('click', () => {
      ['sma_posts','sma_config','sma_activity'].forEach(k => localStorage.removeItem(k));
      closeModal();
      toast('All data cleared', 'warn');
      setTimeout(() => location.reload(), 800);
    });
  });
}

/* ══════════════════════════════════════════════════════════════════
   Init
══════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  /* Nav clicks */
  document.getElementById('nav').querySelectorAll('.nav-item').forEach(el =>
    el.addEventListener('click', () => nav(el.dataset.view))
  );

  /* Topbar buttons */
  document.getElementById('btn-new-post').addEventListener('click', () => nav('schedule'));
  document.getElementById('btn-clear-log').addEventListener('click', () => {
    DB.clearActivity(); render(); toast('Activity log cleared');
  });

  /* Modal close */
  document.getElementById('modal-x').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  /* Initial render */
  nav('dashboard');
});
</script>
</body>
</html>
