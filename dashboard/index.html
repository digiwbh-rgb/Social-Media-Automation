<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Media Automation — Dashboard</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">

    <!-- ── Sidebar ──────────────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="7" fill="#6366f1"/>
            <path d="M7 14c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            <circle cx="14" cy="18" r="3" fill="#fff"/>
            <circle cx="7"  cy="14" r="2" fill="#a5b4fc"/>
            <circle cx="21" cy="14" r="2" fill="#a5b4fc"/>
          </svg>
          <span class="logo-text">SMA</span>
        </div>
        <div class="api-badge" id="api-badge">
          <span class="api-dot"></span>
          <span class="api-label" id="api-label">offline</span>
        </div>
      </div>

      <nav class="nav">
        <a class="nav-item active" data-view="overview" href="#">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M1 2.5A1.5 1.5 0 012.5 1h3A1.5 1.5 0 017 2.5v3A1.5 1.5 0 015.5 7h-3A1.5 1.5 0 011 5.5v-3zM9 2.5A1.5 1.5 0 0110.5 1h3A1.5 1.5 0 0115 2.5v3A1.5 1.5 0 0113.5 7h-3A1.5 1.5 0 019 5.5v-3zM1 10.5A1.5 1.5 0 012.5 9h3A1.5 1.5 0 017 10.5v3A1.5 1.5 0 015.5 15h-3A1.5 1.5 0 011 13.5v-3zM9 10.5A1.5 1.5 0 0110.5 9h3A1.5 1.5 0 0115 10.5v3A1.5 1.5 0 0113.5 15h-3A1.5 1.5 0 019 13.5v-3z"/>
          </svg>
          Overview
        </a>
        <a class="nav-item" data-view="posts" href="#">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M14.5 3a.5.5 0 01.5.5v9a.5.5 0 01-.5.5h-13a.5.5 0 01-.5-.5v-9a.5.5 0 01.5-.5h13zm-13-1A1.5 1.5 0 000 3.5v9A1.5 1.5 0 001.5 14h13a1.5 1.5 0 001.5-1.5v-9A1.5 1.5 0 0014.5 2h-13zM3 5.5a.5.5 0 01.5-.5h9a.5.5 0 010 1h-9a.5.5 0 01-.5-.5zm0 3a.5.5 0 01.5-.5h9a.5.5 0 010 1h-9a.5.5 0 01-.5-.5zm0 3a.5.5 0 01.5-.5h5a.5.5 0 010 1h-5a.5.5 0 01-.5-.5z"/>
          </svg>
          Posts
        </a>
        <a class="nav-item" data-view="generate" href="#">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 3.5a.5.5 0 01.5.5v4h4a.5.5 0 010 1h-4v4a.5.5 0 01-1 0V9H3.5a.5.5 0 010-1H7.5V4a.5.5 0 01.5-.5zM1 1a1 1 0 011-1h4a1 1 0 010 2H3.414l8.293 8.293A1 1 0 0110.293 11.7L2 3.414V5a1 1 0 01-2 0V1z"/>
          </svg>
          Generate
        </a>
        <a class="nav-item" data-view="scheduler" href="#">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 3.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9zM1 8a7 7 0 1114 0A7 7 0 011 8zm7-3.5a.5.5 0 01.5.5v3.25l2.03 1.218a.5.5 0 01-.5.866L7.5 8.866V5a.5.5 0 01.5-.5z"/>
          </svg>
          Scheduler
        </a>
        <div class="nav-divider"></div>
        <a class="nav-item" data-view="config" href="#">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 4.754a3.246 3.246 0 100 6.492 3.246 3.246 0 000-6.492zM5.754 8a2.246 2.246 0 114.492 0 2.246 2.246 0 01-4.492 0z"/>
            <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 01-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 01-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 01.52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 011.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 011.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 01.52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 01-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 01-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 002.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 001.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 00-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 00-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 00-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 003.06 8.377l-.318-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 004.177 3.9l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 002.692-1.115l.094-.319z"/>
          </svg>
          Config
        </a>
      </nav>

      <div class="sidebar-footer">
        <span class="version-tag">v1.0.0</span>
      </div>
    </aside>

    <!-- ── Main ─────────────────────────────────────────────────────── -->
    <div class="main-wrapper">
      <header class="topbar">
        <h1 class="topbar-title" id="topbar-title">Overview</h1>
        <div class="topbar-actions">
          <button class="btn btn-ghost" id="btn-run-once" title="Run scheduler now">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 3.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9zM1 8a7 7 0 1114 0A7 7 0 011 8zm7-3.5a.5.5 0 01.5.5v3.25l2.03 1.218a.5.5 0 01-.5.866L7.5 8.866V5a.5.5 0 01.5-.5z"/>
            </svg>
            Run Now
          </button>
          <button class="btn btn-primary" id="btn-new-post">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 2a.5.5 0 01.5.5v5h5a.5.5 0 010 1h-5v5a.5.5 0 01-1 0v-5h-5a.5.5 0 010-1h5v-5A.5.5 0 018 2z"/>
            </svg>
            Schedule Post
          </button>
        </div>
      </header>

      <main class="content" id="view-container">
        <div class="loading-spinner">
          <div class="spinner"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- ── Modal ──────────────────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Modal</h3>
        <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ── Toasts ─────────────────────────────────────────────────────── -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
